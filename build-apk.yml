name: Build Luna AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Luna AI
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK / NDK / CMake
        run: |
          sdkmanager "platforms;android-36" \
                     "platforms;android-37" \
                     "build-tools;36.0.0" \
                     "cmake;3.22.1" \
                     "ndk;27.2.12479018"

      - name: Clone stable-diffusion.cpp
        run: |
          rm -rf third_party/stable-diffusion.cpp
          mkdir -p third_party
          git clone --recursive https://github.com/leejet/stable-diffusion.cpp.git third_party/stable-diffusion.cpp
          cd third_party/stable-diffusion.cpp
          git checkout --detach d950627
          git submodule update --init --recursive

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Show project structure
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== APP ==="
          find app -maxdepth 5 -type f | sort

      - name: Build debug APK
        env:
          CMAKE_ARGS: "-DGGML_OPENMP=OFF -DSD_WEBP=OFF -DSD_WEBM=OFF -DSD_BUILD_EXAMPLES=OFF -DSD_OPENCL=OFF -DSD_VULKAN=OFF"
        run: gradle :app:assembleDebug --stacktrace --info

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LunaAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
